services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: design-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - design-memory-postgres-data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  design-memory-postgres-data:
