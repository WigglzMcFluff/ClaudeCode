<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Ripples</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hint" id="hint">move your cursor or finger across the canvas · click to drop a ripple</div>

  <div class="toolbar">
    <div class="group palettes" id="palettes"></div>

    <div class="group modes">
      <button class="mode-btn active" data-mode="both">Both</button>
      <button class="mode-btn" data-mode="trails">Trails</button>
      <button class="mode-btn" data-mode="ripples">Ripples</button>
    </div>

    <div class="group slider-group">
      <label for="fade">Fade</label>
      <input type="range" id="fade" min="2" max="20" value="6">
    </div>

    <button class="clear-btn" id="clear">Clear</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
